name: Publish to NPM

on:
    push:
        branches:
            - main

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v3
            - run: npm ci
            - run: npm run build
            - name: Publish to NPM
              env:
                  NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}
              run: |
                  echo "//npm.pkg.github.com/:_authToken=${{ secrets.NODE_AUTH_TOKEN }}" > .npmrc
                  echo "@quirinecker:registry=https://npm.pkg.github.com" >> .npmrc
                  npm publish
