name: Publish to NPM

on:
    release:
        types: [created]

permissions:
    contents: read
    packages: write

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v3
            - run: npm ci
            - run: npm run build
            - name: Publish to NPM
              env:
                  NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}
              run: |
                  npm publish
